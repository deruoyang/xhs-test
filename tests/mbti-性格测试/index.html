<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>心理测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .container {
    width: 100%;
    max-width: 400px;
    background: #fff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #f0f0f0;
    border-radius: 3px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  .question-number {
    font-size: 13px;
    color: #999;
    margin-bottom: 8px;
  }
  .question-text {
    font-size: 20px;
    font-weight: 700;
    color: #333;
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    width: 100%;
    padding: 16px 20px;
    border: 2px solid #eee;
    border-radius: 12px;
    background: #fff;
    font-size: 16px;
    color: #333;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option:active { transform: scale(0.98); }
  .option.selected { border-color: #667eea; background: #f8f7ff; }
  .option-letter {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #f5f5f5;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: #667eea;
    flex-shrink: 0;
  }
  .option.selected .option-letter { background: #667eea; color: #fff; }

  .result-page { display: none; text-align: center; }
  .result-icon { font-size: 64px; margin-bottom: 16px; }
  .result-type {
    font-size: 28px;
    font-weight: 800;
    color: #333;
    margin-bottom: 4px;
  }
  .result-subtitle {
    font-size: 14px;
    color: #999;
    margin-bottom: 20px;
  }
  .result-section {
    background: #f8f9ff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    text-align: left;
  }
  .result-section h3 {
    font-size: 14px;
    color: #667eea;
    margin-bottom: 8px;
  }
  .result-section p {
    font-size: 14px;
    color: #555;
    line-height: 1.6;
  }
  .traits {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
    justify-content: center;
  }
  .trait {
    padding: 6px 16px;
    background: #f0edff;
    color: #667eea;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
  }
  .restart-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .restart-btn:active { opacity: 0.9; transform: scale(0.98); }

  .start-page { text-align: center; }
  .start-icon { font-size: 72px; margin-bottom: 16px; }
  .start-title { font-size: 24px; font-weight: 800; color: #333; margin-bottom: 8px; }
  .start-desc { font-size: 14px; color: #888; margin-bottom: 8px; line-height: 1.6; }
  .start-count { font-size: 13px; color: #bbb; margin-bottom: 28px; }
  .start-btn {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .start-btn:active { opacity: 0.9; transform: scale(0.98); }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
  <!-- 开始页 -->
  <div class="start-page" id="startPage">
    <div class="start-icon" id="startIcon">🧠</div>
    <div class="start-title" id="startTitle">心理测试</div>
    <div class="start-desc" id="startDesc">10道题，测测你的真实性格</div>
    <div class="start-count" id="startCount">已有 12,368 人参与测试</div>
    <button class="start-btn" onclick="startTest()">开始测试</button>
  </div>

  <!-- 答题页 -->
  <div id="questionPage" class="hidden">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="question-number" id="questionNumber"></div>
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
  </div>

  <!-- 结果页 -->
  <div class="result-page" id="resultPage">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-type" id="resultType"></div>
    <div class="result-subtitle" id="resultSubtitle"></div>
    <div class="traits" id="resultTraits"></div>
    <div class="result-section">
      <h3>性格分析</h3>
      <p id="resultAnalysis"></p>
    </div>
    <div class="result-section">
      <h3>适合你的建议</h3>
      <p id="resultAdvice"></p>
    </div>
    <button class="restart-btn" onclick="restartTest()">再测一次</button>
  </div>
</div>

<script>
let config = null;
let currentQuestion = 0;
let scores = [];

// 加载配置
fetch('config.json')
  .then(r => r.json())
  .then(c => { config = c; renderStart(); })
  .catch(() => {
    // 如果没有 config.json，使用默认配置
    config = getDefaultConfig();
    renderStart();
  });

function getDefaultConfig() {

    ],
    results: {
      "ENFJ": { type: "ENFJ - 主人公", icon: "🌟", subtitle: "天生的领导者", traits: ["热情", "有感染力", "责任心强", "善于沟通"], analysis: "你是一个充满魅力和感染力的人，天生具有领导才能。你善于理解他人的需求，并愿意帮助他人成长。在人群中，你往往是那个带动气氛、凝聚力量的核心人物。", advice: "你的优势在于与人连接和激励他人。适合从事教育、咨询、管理等领域。注意不要过度承担他人的情绪负担，学会在帮助他人的同时也照顾好自己。" },
      "ENFP": { type: "ENFP - 追梦者", icon: "🦋", subtitle: "自由奔放的创造者", traits: ["好奇", "热情", "想象力丰富", "善于社交"], analysis: "你是一个充满好奇心和创造力的人，对世界保持着孩童般的热情。你善于发现生活中的可能性，总能从不同角度看待问题，给身边的人带来新鲜感和灵感。", advice: "你的优势在于创意和人际连接。适合从事创意、营销、心理咨询等领域。注意培养专注力，把好的想法真正落地执行。" },
      "ENTJ": { type: "ENTJ - 指挥官", icon: "👑", subtitle: "果敢的战略家", traits: ["果断", "有远见", "执行力强", "理性"], analysis: "你是一个天生的战略家和领导者，善于制定计划并推动执行。你面对问题冷静理性，能够快速做出决策，并带领团队朝着目标前进。", advice: "你的优势在于战略规划和执行力。适合从事管理、创业、金融等领域。注意在追求效率的同时，也关注他人的感受，学会柔性沟通。" },
      "ENTP": { type: "ENTP - 辩论家", icon: "💡", subtitle: "机智的创新者", traits: ["聪明", "好奇", "善于辩论", "思维活跃"], analysis: "你是一个思维敏捷、充满创意的人，喜欢挑战传统观念，享受智力上的交锋。你善于从不同角度思考问题，总能找到别人想不到的解决方案。", advice: "你的优势在于创新和解决问题。适合从事科技、咨询、创业等领域。注意不要因为追求新鲜感而频繁切换方向，把精力聚焦在最重要的目标上。" },
      "ESFJ": { type: "ESFJ - 守护者", icon: "🤗", subtitle: "温暖贴心的照顾者", traits: ["体贴", "可靠", "善于合作", "注重和谐"], analysis: "你是一个温暖、体贴、可靠的人，非常关心身边的人。你善于维护团队和谐，注重细节，总是能在别人需要的时候伸出援手。", advice: "你的优势在于关怀他人和维护关系。适合从事护理、教育、行政等领域。注意不要过度在意他人的评价，学会坚持自己的立场。" },
      "ESFP": { type: "ESFP - 表演者", icon: "🎭", subtitle: "活在当下的乐天派", traits: ["开朗", "随性", "感染力强", "热爱生活"], analysis: "你是一个充满活力和感染力的人，善于享受当下，把快乐带给身边的人。你适应能力强，面对突发情况能够灵活应对，是朋友眼中的开心果。", advice: "你的优势在于社交和适应能力。适合从事销售、表演、活动策划等领域。注意在享受当下的同时，也为未来做一些规划。" },
      "ESTJ": { type: "ESTJ - 管理者", icon: "📋", subtitle: "高效可靠的组织者", traits: ["务实", "高效", "可靠", "有原则"], analysis: "你是一个务实高效的人，善于组织和管理，做事有条不紊。你重视规则和秩序，是团队中可以依赖的稳定力量。", advice: "你的优势在于组织管理和执行力。适合从事管理、行政、财务等领域。注意在坚持原则的同时，也要给他人留出灵活变通的空间。" },
      "ESTP": { type: "ESTP - 冒险家", icon: "🔥", subtitle: "大胆果敢的行动派", traits: ["勇敢", "灵活", "务实", "行动力强"], analysis: "你是一个行动力强、勇于冒险的人，善于在复杂环境中快速做出反应。你不喜欢空谈，更倾向于直接行动，在实践中找到最佳方案。", advice: "你的优势在于行动力和应变能力。适合从事销售、运动、创业等领域。注意在快速行动的同时，也多考虑长期影响和他人感受。" },
      "INFJ": { type: "INFJ - 提倡者", icon: "🌙", subtitle: "深邃的理想主义者", traits: ["深刻", "有洞察力", "理想主义", "温柔坚定"], analysis: "你是一个思想深刻、富有洞察力的人，对世界有自己独特的理解。你善于感知他人的情绪和需求，虽然话不多，但总能说到点子上。", advice: "你的优势在于深度思考和洞察人心。适合从事写作、心理咨询、研究等领域。注意不要过度沉浸在自己的世界里，适当表达自己的需求。" },
      "INFP": { type: "INFP - 调停者", icon: "🌿", subtitle: "温柔的灵魂诗人", traits: ["敏感", "有创造力", "理想主义", "善良"], analysis: "你是一个内心丰富、充满理想主义的人，对美和意义有着天然的敏感。你重视内心的价值观，不愿意随波逐流，渴望找到属于自己的独特道路。", advice: "你的优势在于创意和共情能力。适合从事写作、艺术、设计、公益等领域。注意不要让理想主义变成完美主义，学会接受不完美。" },
      "INTJ": { type: "INTJ - 建筑师", icon: "🏗️", subtitle: "独立深邃的战略家", traits: ["理性", "独立", "有远见", "善于分析"], analysis: "你是一个独立思考、富有远见的人，善于系统性分析和长远规划。你不喜欢无意义的社交，更享受深度思考的过程，总能洞察事物的本质。", advice: "你的优势在于战略思维和独立分析。适合从事科技、研究、金融等领域。注意在追求完美的同时，也要学会与人协作，分享自己的想法。" },

      "ISTJ": { type: "ISTJ - 物流师", icon: "⚙️", subtitle: "严谨可靠的实干家", traits: ["严谨", "可靠", "务实", "有责任心"], analysis: "你是一个严谨、务实、值得信赖的人，做事一丝不苟。你重视事实和数据，做事有始有终，是团队中最可靠的中坚力量。", advice: "你的优势在于严谨和可靠。适合从事会计、法律、工程等领域。注意在坚持规则的同时，也要拥抱变化和新可能性。" },
      "ISTP": { type: "ISTP - 鉴赏家", icon: "🔧", subtitle: "冷静务实的手艺人", traits: ["冷静", "务实", "动手能力强", "独立"], analysis: "你是一个冷静、务实、动手能力强的人，喜欢通过实际操作来理解世界。你面对危机时沉着冷静，善于找到最直接有效的解决方案。", advice: "你的优势在于动手能力和问题解决。适合从事工程、技术、运动等领域。注意在专注做事的同时，也多与人沟通，分享你的想法。" }
    }
  };
}

function renderStart() {
  document.getElementById('startIcon').textContent = config.icon;
  document.getElementById('startTitle').textContent = config.title;
  document.getElementById('startDesc').textContent = config.description;
  document.getElementById('startCount').textContent = `已有 ${(config.participantCount || 10000).toLocaleString()} 人参与测试`;
}

function startTest() {
  currentQuestion = 0;
  scores = {};
  document.getElementById('startPage').classList.add('hidden');
  document.getElementById('questionPage').classList.remove('hidden');
  document.getElementById('resultPage').style.display = 'none';
  showQuestion();
}

function showQuestion() {
  const q = config.questions[currentQuestion];
  const total = config.questions.length;
  document.getElementById('progressFill').style.width = (currentQuestion / total * 100) + '%';
  document.getElementById('questionNumber').textContent = `第 ${currentQuestion + 1} / ${total} 题`;
  document.getElementById('questionText').textContent = q.text;

  const letters = ['A', 'B', 'C', 'D'];
  const container = document.getElementById('optionsContainer');
  container.innerHTML = q.options.map((opt, i) => `
    <button class="option" onclick="selectOption(${i})">
      <span class="option-letter">${letters[i]}</span>
      ${opt.text}
    </button>
  `).join('');
}

function selectOption(index) {
  const q = config.questions[currentQuestion];
  const scores_ = q.options[index].scores;
  for (const [key, val] of Object.entries(scores_)) {
    scores[key] = (scores[key] || 0) + val;
  }

  currentQuestion++;
  if (currentQuestion >= config.questions.length) {
    showResult();
  } else {
    showQuestion();
  }
}

function showResult() {
  document.getElementById('questionPage').classList.add('hidden');
  document.getElementById('resultPage').style.display = 'block';
  document.getElementById('progressFill').style.width = '100%';

  // 计算类型
  const type = [
    (scores['E'] || 0) >= (scores['I'] || 0) ? 'E' : 'I',
    (scores['S'] || 0) >= (scores['N'] || 0) ? 'S' : 'N',
    (scores['T'] || 0) >= (scores['F'] || 0) ? 'T' : 'F',
    (scores['J'] || 0) >= (scores['P'] || 0) ? 'J' : 'P'
  ].join('');

  const result = config.results[type] || config.results[Object.keys(config.results)[0]];
  document.getElementById('resultIcon').textContent = result.icon;
  document.getElementById('resultType').textContent = result.type;
  document.getElementById('resultSubtitle').textContent = result.subtitle;
  document.getElementById('resultTraits').innerHTML = result.traits.map(t => `<span class="trait">${t}</span>`).join('');
  document.getElementById('resultAnalysis').textContent = result.analysis;
  document.getElementById('resultAdvice').textContent = result.advice;
}

function restartTest() {
  currentQuestion = 0;
  scores = {};
  document.getElementById('resultPage').style.display = 'none';
  document.getElementById('startPage').classList.remove('hidden');
  document.getElementById('progressFill').style.width = '0%';
}
</script>
</body>
