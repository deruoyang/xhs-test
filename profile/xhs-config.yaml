# 账号配置文件
# 填完这个文件，运行任何工作流时 AI 会自动读取，不会再反复问同样的问题

# ── 基础定位 ──────────────────────────────────────────────
account_direction: "心理测试"          # 账号方向，一句话描述
target_audience: "在人生重要节点有焦虑、但说不清楚的人"

# ── 人设 ──────────────────────────────────────────────────
persona:
  type: "轻人设陪伴号"                 # 工具号 / 轻人设陪伴号
  signature: "每个选择背后，都有你没说出口的话"  # 封面顶部固定签名句
  tone: "温柔、不说教、帮用户说出他们说不清的话"

# ── 视觉风格 ───────────────────────────────────────────────
visual:
  style: "淡淡的温柔忧郁风"
  primary_color: "#a8c4d4"            # 雾蓝
  secondary_color: "#b8a8d4"          # 淡紫
  background: "浅色系，白底或浅灰底"
  cover_logic: "封面即第一道题"        # 封面即第一道题 / 情绪共鸣型 / 纯文字金句型

# ── 选题方向池（由调研 skill 初始化，note skill 自动维护）────
topics:
  - direction: "城市/生活方式选择"
    priority: 1
    note: "爆款天花板最高，参考开心轩宝115万案例"
    angles_used:
      - "适合定居的城市（身体潜意识）"
    angles_remaining:
      - "你适合留在大城市，还是回小城市"
      - "你适合北方城市还是南方城市"
      - "30岁后你该留在哪里"
      - "你的性格和哪座城市是天选CP"
  - direction: "原生家庭/关系模式"
    priority: 2
    note: "情感共鸣强，评论区互动好"
    angles_used: []
    angles_remaining:
      - "你妈是哪种妈妈"
      - "你在家里扮演的是哪种角色"
      - "你的原生家庭给了你什么隐形信念"
      - "你是怎么学会讨好别人的"
  - direction: "依恋风格/情感关系"
    priority: 3
    note: "MBTI之后最热心理概念"
    angles_used: []
    angles_remaining:
      - "你是焦虑型还是回避型依恋"
      - "你在关系里是付出型还是索取型"
      - "你爱一个人的方式是什么"
      - "你在关系里最害怕的是什么"
  - direction: "职场决策"
    priority: 4
    note: "避免重复辞职焦虑，切具体场景"
    angles_used: []
    angles_remaining:
      - "你适合打工还是创业"
      - "你的老板是哪种类型"
      - "你在开会时是哪种状态"
      - "你是能力到顶了，还是待错了地方"
  - direction: "自我认知"
    priority: 5
    note: "长尾内容，适合搜索流量"
    angles_used: []
    angles_remaining:
      - "你是真的社恐还是只是累了不想社交"
      - "你是边界感差还是根本不知道边界在哪"
      - "你是情绪化还是情绪敏感"
      - "你的精神内耗是哪种类型"

# ── 标题偏好 ───────────────────────────────────────────────
title_preference:
  preferred:
    - "为什么你总X"        # 诊断命名型，点击动机最强
    - "方法+结果型"        # 算法友好，搜索入口
  avoid:
    - "你是X还是Y（同话题重复超过3篇）"

# ── 变现阶段 ───────────────────────────────────────────────
monetization_stage: 1   # 1=验证内容期 / 2=轻量变现期 / 3=产品化期
